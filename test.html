<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>逻辑自检（无渲染）</title></head>
<body>
<script src="js/lib/three.min.js"></script>
<script src="js/util.js"></script>
<script src="js/car.js"></script>
<script src="js/scenarios.js"></script>
<script>
/* =====================================================
 * test.html - 场景逻辑自动化验证（无 WebGL 渲染）
 * 用自动驾驶脚本验证: 分步引导可完成 / 几何正确 / 无误判
 * ===================================================== */
const log = (...a) => console.log('[TEST]', ...a);
window.addEventListener('error', e => log('PAGE_ERROR:', e.message, e.filename, e.lineno));

function runScenario(def) {
  ALL_CARS.length = 0;          // 清除上一场景的车辆注册(避免幽灵车)
  const scene = new THREE.Scene();
  const car = new Car(0xc23b2e);
  scene.add(car.group);
  const G = { s: {}, t: 0, aiCars: [], violations: [], stepIdx: 0, finished: false };
  const api = {
    car, scene, aiCars: G.aiCars,
    get s() { return G.s; }, get t() { return G.t; },
    world: null,
    toast() { },
    addViolation(text, penalty) { G.violations.push(text); log('  违规:', text, `@(${car.x.toFixed(1)},${car.z.toFixed(1)}) h=${(car.heading / D2R).toFixed(0)} v=${car.speed.toFixed(1)}`); }
  };
  api.world = new WorldBuilder(scene);
  try { def.setup(api); } catch (e) { log('SETUP_ERROR:', def.id, e.stack || e.message); return false; }
  const ap = makeAutopilot(def.id, api, G);
  let simT = 0;
  const worldCheck = createWorldChecker(car, api.world, G.aiCars, () => simT);
  const dt = 1 / 60;
  let steps = 0;
  for (let t = 0; t < 300; t += dt) {
    G.t = t; simT = t * 1000;
    let input;
    try { input = ap(dt); } catch (e) { log('AUTOPILOT_ERROR:', def.id, 't=' + t.toFixed(1), e.stack || e.message); return false; }
    try {
      const onRoad = !api.world.drivables.length || api.world.isDrivable(car.x, car.z);
      car.updatePlayer(dt, input, onRoad);
      for (const a of G.aiCars) a.updateAI(dt);
      worldCheck(api.addViolation, null);
      if (!G.finished) {
        const st = def.steps[G.stepIdx];
        if (st && st.check(api)) {
          G.stepIdx++;
          log(`  ✓ 步骤${G.stepIdx}/${def.steps.length}: ${st.name}  (t=${t.toFixed(1)} pos=${car.x.toFixed(1)},${car.z.toFixed(1)} h=${(car.heading / D2R).toFixed(0)} v=${car.speed.toFixed(1)})`);
          if (G.stepIdx >= def.steps.length) G.finished = true;
        }
        if (def.update) def.update(api, dt);
      }
    } catch (e) { log('FRAME_ERROR:', def.id, 't=' + t.toFixed(1), String(e.stack || e.message).replace(/\n/g, ' | ')); return false; }
    steps++;
    if (G.finished) break;
  }
  const score = Math.max(0, 100 - G.violations.length * 15);
  const pass = G.finished;
  log(`${pass ? '✅ PASS' : '❌ FAIL'} ${def.id}: 步骤 ${G.stepIdx}/${def.steps.length}, 违规 ${G.violations.length}, 模拟 ${(steps * dt).toFixed(1)}s, 末位置 (${car.x.toFixed(1)}, ${car.z.toFixed(1)}) h=${(car.heading / D2R).toFixed(0)}`);
  return pass;
}

/* ---------------- 自动驾驶脚本 ---------------- */
function makeAutopilot(id, api, G) {
  const car = api.car;
  const K = { throttle: 0, brake: 0, steer: 0, handbrake: false };
  let phase = 0, pt = 0;
  car.gear = 'D';

  /* 通用: 纵向速度控制 (支持倒挡目标) */
  function speedTo(v) {
    const dv = v - car.speed;
    if (Math.abs(dv) < 0.25) { K.throttle = 0; K.brake = 0; }
    else if (dv > 0) { K.throttle = 1; K.brake = 0; }
    else {
      if (car.speed > 0.2) { K.throttle = 0; K.brake = 0.9; }
      else { K.throttle = 1; K.brake = 0; }
    }
  }
  /* 通用: 航向控制 (期望航向 desired, 弧度) */
  function headTo(desired) {
    const err = angNorm(desired - car.heading);
    K.steer = clamp(err * 2.5, -1, 1);
  }
  /* 通用: 跟踪前方目标点 */
  function pointTo(tx, tz) {
    headTo(headingTo(car.x, car.z, tx, tz));
  }
  function stopped() { return Math.abs(car.speed) < 0.03; }
  /* 通用: 前方同车道最近车距(无则999) */
  function followDist() {
    const f = fwd(car.heading);
    let best = 999;
    for (const c of api.aiCars) {
      const dx = c.x - car.x, dz = c.z - car.z;
      const ah = dx * f.x + dz * f.z;
      const lat = Math.abs(-dx * f.z + dz * f.x);
      if (ah > 0 && ah < 14 && lat < 2.4 && ah < best) best = ah;
    }
    return best;
  }
  /* 通用: 根据前车距离限制目标速度 */
  function followCap(v) {
    const d = followDist();
    return d > 6 + car.speed * 0.8 ? v : Math.max(0, (d - 5.5) * 1.5);
  }

  if (id === 'reverseBay') {
    car.gear = 'D';
    return function (dt) {
      pt += dt;
      if (phase === 0) {           // 直行接近
        speedTo(2.4);
        headTo(90 * D2R + clamp((3.6 - car.z) * 0.25, -0.3, 0.3) * -1);
        if (car.x > 27.8) { phase = 1; }
      } else if (phase === 1) {    // 停车对位
        K.throttle = 0; K.brake = 1;
        if (stopped()) { phase = 2; car.gear = 'R'; }
      } else if (phase === 2) {    // 右打满倒车
        K.steer = -1; speedTo(-1.3); car.gear = 'R';
        if (angDiff(car.heading, 180 * D2R) < 5 * D2R) { phase = 3; K.steer = 0; }
      } else if (phase === 3) {    // 回正倒入
        K.steer = 0; speedTo(-1.2); car.gear = 'R';
        if (car.z > 8.85) { phase = 4; }
      } else { K.throttle = 0; K.brake = 1; K.steer = 0; }
      return K;
    };
  }

  if (id === 'parallel') {
    car.gear = 'D';
    return function (dt) {
      pt += dt;
      if (phase === 0) {           // 开右灯靠边
        car.setBlinker('R');
        speedTo(3);
        headTo(90 * D2R + clamp((6.0 - car.z) * 0.3, -0.35, 0.35) * -1);
        if (car.x > 21.6) phase = 1;
      } else if (phase === 1) {    // 对位停车
        K.throttle = 0; K.brake = 1;
        if (stopped()) { phase = 2; car.gear = 'R'; car.setBlinker(null); }
      } else if (phase === 2) {    // 右打满倒至45°
        K.steer = -1; speedTo(-1.2); car.gear = 'R';
        if (angDiff(car.heading, 90 * D2R) > 42 * D2R) { phase = 3; K.steer = 0; }
      } else if (phase === 3) {    // 回正倒
        K.steer = 0; speedTo(-1.1); car.gear = 'R';
        if (car.x < 19.15) { phase = 4; }
      } else if (phase === 4) {    // 左打满
        K.steer = 1; speedTo(-1.0); car.gear = 'R';
        if (angDiff(car.heading, 90 * D2R) < 6 * D2R) { phase = 5; K.steer = 0; }
      } else { K.throttle = 0; K.brake = 1; K.steer = 0; }
      return K;
    };
  }

  if (id === 'overtake') {
    car.gear = 'D';
    return function (dt) {
      pt += dt;
      const truck = api.s.truck;
      if (phase === 0) {           // 跟车
        const gap = truck.x - car.x;
        speedTo(gap > 30 ? 14 : 8.8);
        headTo(90 * D2R + clamp((0 - car.z) * 0.3, -0.3, 0.3) * -1);
        if (car.x > -88 && gap > 16) { phase = 1; car.setBlinker('L'); pt = 0; }
      } else if (phase === 1) {    // 灯亮3秒
        speedTo(8.6); headTo(90 * D2R);
        if (pt > 3.2) phase = 2;
      } else if (phase === 2) {    // 变道至左道
        speedTo(9.5);
        pointTo(car.x + 14, -3.5);
        if (car.z < -2.6) { phase = 3; }
      } else if (phase === 3) {    // 加速超越
        speedTo(21);
        headTo(90 * D2R + clamp((-3.5 - car.z) * 0.3, -0.3, 0.3) * -1);
        if (car.x > truck.x + 14) { phase = 4; car.setBlinker('R'); pt = 0; }
      } else if (phase === 4) {    // 右灯
        speedTo(20); headTo(90 * D2R);
        if (pt > 2.6) phase = 5;
      } else if (phase === 5) {    // 驶回
        speedTo(19);
        pointTo(car.x + 14, 0);
        if (Math.abs(car.z) < 1.3) { phase = 6; car.setBlinker(null); }
      } else {
        speedTo(18); headTo(90 * D2R);
      }
      return K;
    };
  }

  if (id === 'merge') {
    car.gear = 'D';
    return function (dt) {
      pt += dt;
      const lane0 = api.aiCars.filter(a => Math.abs(a.z - 0) < 1);
      function gapOk() {
        return lane0.every(a => (a.x - car.x) < -12 || (a.x - car.x) > 28);
      }
      if (phase === 0) {           // 加速
        K.throttle = 1; K.brake = 0;
        headTo(90 * D2R + clamp((3.5 - car.z) * 0.3, -0.3, 0.3) * -1);
        if (car.speed > 17.5) { phase = 1; car.setBlinker('L'); pt = 0; }
      } else if (phase === 1) {    // 灯亮观察
        speedTo(21);
        headTo(90 * D2R);
        if (pt > 3 && gapOk()) phase = 2;
        else if (pt > 3 && !gapOk()) speedTo(20);
      } else if (phase === 2) {    // 汇入
        speedTo(21);
        pointTo(car.x + 22, 0);
        if (car.z < 1.0) { phase = 3; car.setBlinker(null); }
      } else {
        speedTo(24);
        headTo(90 * D2R + clamp((0 - car.z) * 0.3, -0.3, 0.3) * -1);
      }
      return K;
    };
  }

  if (id === 'roundabout') {
    car.gear = 'D';
    return function (dt) {
      pt += dt;
      const r = Math.hypot(car.x, car.z);
      const a = Math.atan2(car.z, car.x);
      const aim = Math.atan2(1.5 - car.x, -12);   // 纯追踪: 前方12m处的车道中线
      if (phase === 0) {           // 接近减速
        speedTo(9);
        headTo(aim);
        if (car.z < 40) speedTo(7);
        if (car.z < 30) { phase = 1; pt = 0; }
      } else if (phase === 1) {    // 让行等待
        if (car.z < 26) { speedTo(0); if (Math.abs(car.speed) < 0.5) K.steer = 0; }
        else { speedTo(5); headTo(aim); }
        let nearest = 999;
        for (const c of api.s.circ) {
          if (c.speed < 2) continue;                     // 只计真正在行驶的环道车
          const ca = Math.atan2(c.z, c.x);
          const ad = angNorm(ca - a);
          if (ad > 0) nearest = Math.min(nearest, ad * 17);  // 逆时针接近入口的来车
        }
        if (nearest > 20 || pt > 25) { phase = 2; }
      } else if (phase === 2) {    // 驶入并沿环道行驶(纯追踪环道中心线前方25°处)
        const ahead = a - 25 * D2R;
        const px = 17 * Math.cos(ahead), pz = 17 * Math.sin(ahead);
        speedTo(followCap(7.5));
        headTo(Math.atan2(px - car.x, pz - car.z));
        if (api.s.traveled > 255 * D2R) { phase = 3; car.setBlinker('R'); }
      } else if (phase === 3) {    // 出口驶出
        speedTo(followCap(7));
        pointTo(-34, -1.5);
        if (r > 23 && car.x < -20) { phase = 4; car.setBlinker(null); }
      } else {
        speedTo(followCap(9));
        pointTo(-60, -1.5);
      }
      return K;
    };
  }

  if (id === 'variableLane') {
    car.gear = 'D';
    return function (dt) {
      pt += dt;
      if (phase === 0) {           // 中间车道行驶
        speedTo(VL_FAST ? 12.5 : 8);
        headTo(90 * D2R + clamp((0 - car.z) * 0.3, -0.3, 0.3) * -1);
        if (api.s.locked) phase = 1;
      } else if (phase === 1) {
        if (api.s.locked === 'left') {
          if (car.x > -10) { speedTo(4.5); pointTo(2.5, -18); }
          else { speedTo(VL_FAST ? 10 : 8); headTo(90 * D2R + clamp((0 - car.z) * 0.3, -0.3, 0.3) * -1); }
          if (car.z < -19) { phase = 2; car.setBlinker('L'); }
        } else {
          speedTo(8);
          headTo(90 * D2R + clamp((0 - car.z) * 0.3, -0.3, 0.3) * -1);
        }
      } else if (phase === 2) {
        speedTo(6);
        headTo(180 * D2R + clamp((2.0 - car.x) * 0.25, -0.3, 0.3));
        if (car.z < -25) { phase = 3; car.setBlinker(null); }
      } else {
        speedTo(8); headTo(180 * D2R + clamp((2.0 - car.x) * 0.25, -0.3, 0.3));
      }
      return K;
    };
  }

  if (id === 'tidal') {
    car.gear = 'D';
    return function (dt) {
      pt += dt;
      if (phase === 0) {           // 普通车道行驶等绿灯
        speedTo(11);
        headTo(90 * D2R + clamp((3.5 - car.z) * 0.3, -0.3, 0.3) * -1);
        if (api.s.open) { phase = 1; car.setBlinker('L'); }
      } else if (phase === 1) {    // 驶入潮汐车道
        speedTo(11);
        pointTo(car.x + 16, 0);
        if (Math.abs(car.z) < 1.4) { phase = 2; car.setBlinker(null); }
      } else if (phase === 2) {    // 潮汐车道内行驶
        speedTo(12);
        headTo(90 * D2R + clamp((0 - car.z) * 0.3, -0.3, 0.3) * -1);
        if (api.s.closed) { phase = 3; car.setBlinker('R'); }
      } else if (phase === 3) {    // 驶回普通车道
        speedTo(12);
        pointTo(car.x + 16, 3.5);
        if (car.z > 2.6) { phase = 4; car.setBlinker(null); }
      } else {
        speedTo(13);
        headTo(90 * D2R + clamp((3.5 - car.z) * 0.3, -0.3, 0.3) * -1);
      }
      return K;
    };
  }

  return function () { return K; };
}

/* ---------------- 运行 ---------------- */
const qs = new URLSearchParams(location.search);
const only = qs.get('id');
const VL_FAST = qs.get('vl') === 'fast';
let allPass = true;
for (const def of SCENARIOS) {
  if (only && def.id !== only) continue;
  log('=== 场景:', def.name, '(' + def.id + ') ===');
  const ok = runScenario(def);
  if (!ok) allPass = false;
}
log(allPass ? '🏁 全部场景通过自动化验证' : '⚠ 存在未通过的场景');
</script>
</body>
</html>
